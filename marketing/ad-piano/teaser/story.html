@font-face { font-family: "Fredoka"; src: url("fredoka-latin.woff2") format("woff2"); font-weight: 300 700; }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; background:#eaf0f9; font-family:Nunito, sans-serif; color:#15213a; position:relative; }
.blob { position:absolute; border-radius:50%; opacity:.6; }
.wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:250px 70px 0; }
.mark { display:inline-flex; align-items:baseline; gap:.1em; background:#fff; border-radius:999px; padding:16px 38px; box-shadow:0 12px 30px rgba(21,33,58,.10); font-family:Fredoka; font-weight:600; font-size:44px; }
.mark svg { height:.75em; width:auto; color:#1e56c0; }
.kicker { margin-top:70px; font-family:Fredoka; font-weight:600; font-size:44px; padding:12px 40px; border-radius:999px; background:#ffd3bf; color:#5a2310; }
h1 { margin-top:34px; font-family:Fredoka; font-weight:700; font-size:132px; line-height:1.02; text-align:center; letter-spacing:-.01em; }
h1 b { color:#2f6fe0; font-weight:700; }
.cards { position:relative; width:1080px; height:600px; margin-top:50px; }
.card { position:absolute; border-radius:34px; overflow:hidden; background:#fff; border:3px solid #d8e2f1; box-shadow:0 34px 80px rgba(21,33,58,.22); }
.card img { display:block; width:100%; }
.back { width:860px; left:150px; top:0; transform:rotate(4deg); opacity:.95; }
.front { width:980px; left:50px; top:200px; transform:rotate(-2.5deg); }
.tag { position:absolute; font-family:Fredoka; font-weight:600; font-size:34px; padding:10px 28px; border-radius:999px; box-shadow:0 10px 24px rgba(21,33,58,.15); }
.chips { display:flex; gap:18px; margin-top:110px; flex-wrap:wrap; justify-content:center; }
.chip { font-weight:800; font-size:36px; padding:14px 32px; border-radius:999px; }
.url { margin-top:44px; text-align:center; font-family:Fredoka; font-weight:600; font-size:46px; color:#1e56c0; }
