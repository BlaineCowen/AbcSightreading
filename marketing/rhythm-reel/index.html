    <style>
      @font-face {
        font-family: "Fredoka";
        src: url("assets/fonts/fredoka-latin.woff2") format("woff2");
        font-weight: 300 700;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #eaf0f9;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #eaf0f9;
        font-family: "Fredoka", sans-serif;
        color: #15213a;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        opacity: 0.55;
      }

      /* Headline: inside the Reel safe zone (clear of the top bar and the caption area) */
      .head-wrap {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 290px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
      }
      .line {
        display: block;
        font-weight: 700;
        font-size: 100px;
        line-height: 1.12;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .line.quote {
        font-size: 92px;
        color: #1e56c0;
      }
      .mean {
        position: relative;
        display: inline-block;
        padding: 0 26px;
      }
      .mean .hl {
        position: absolute;
        left: 0;
        right: 0;
        top: 14%;
        bottom: 6%;
        border-radius: 26px;
        background: #ffefa8;
        transform-origin: left center;
      }
      .mean .txt {
        position: relative;
      }

      /* Footage card */
      .card {
        position: absolute;
        left: 40px;
        top: 810px;
        width: 1000px;
        height: 611px;
        border-radius: 36px;
        overflow: hidden;
        background: #15213a;
        border: 3px solid #ffffff;
        box-shadow: 0 30px 70px rgba(21, 33, 58, 0.22);
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 49% 20%;
      }
      .footage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .wordmark {
        position: absolute;
        left: 0;
        right: 0;
        top: 1490px;
        display: flex;
        justify-content: center;
      }
      .wordmark .pill {
        display: inline-flex;
        align-items: baseline;
        gap: 0.1em;
        background: #ffffff;
        border-radius: 999px;
        padding: 16px 38px;
        box-shadow: 0 12px 30px rgba(21, 33, 58, 0.1);
        font-size: 46px;
      }
      .wordmark .abc {
        height: 0.75em;
        width: auto;
        color: #1e56c0;
      }
      .wordmark .rest {
        font-weight: 600;
        line-height: 1;
        color: #15213a;
      }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Headline in at once, so the hook reads in the first second
      tl.fromTo(
        ["#l1", "#l2", "#l3"],
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)", stagger: 0.12 },
        0.1,
      );
      tl.fromTo("#card", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25);
      tl.fromTo("#wordmark-pill", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);

      // Highlight under "Mean something" lands on the 97%
      tl.fromTo("#hl", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 9.0);
      tl.fromTo("#l3", { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 9.0);

      // Punch in on the score panel each time it opens (68% at 2.0s, 97% at 8.9s)
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.3, duration: 0.5, ease: "power3.inOut" }, 2.0);
      tl.to("#cam", { scale: 1, duration: 0.45, ease: "power3.inOut" }, 4.2);
      tl.to("#cam", { scale: 1.3, duration: 0.5, ease: "power3.inOut" }, 8.9);
      tl.to("#cam", { scale: 1.42, duration: 4.2, ease: "none" }, 9.4);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
