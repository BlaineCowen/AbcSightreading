<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1350" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Fredoka"; src: url("assets/fonts/fredoka-latin.woff2") format("woff2"); font-weight: 300 700; font-style: normal; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #eaf0f9; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #eaf0f9; font-family: "Fredoka", sans-serif; color: #15213a; }
.blob { position: absolute; border-radius: 50%; opacity: 0.55; }
.cap { position: absolute; left: 40px; right: 40px; top: 70px; display: flex; flex-direction: column; align-items: center; text-align: center; font-weight: 700; font-size: 86px; line-height: 1.1; letter-spacing: -0.01em; }
.cap span { display: block; white-space: nowrap; }
.cap .blue { color: #1e56c0; }
.card { position: absolute; left: 40px; top: 380px; width: 1000px; height: 640px; border-radius: 36px; overflow: hidden; background: #ffffff; box-shadow: 0 30px 70px rgba(21, 33, 58, 0.18); }
.card img { position: absolute; left: 10px; top: 24px; width: 980px; height: auto; display: block; }
.mark { position: absolute; left: 0; right: 0; top: 1200px; display: flex; justify-content: center; }
.wordmark { display: inline-flex; align-items: baseline; gap: 0.1em; background: #ffffff; border-radius: 999px; padding: 12px 32px; box-shadow: 0 12px 30px rgba(21, 33, 58, 0.1); font-size: 42px; }
.wordmark .abc { height: 0.75em; width: auto; color: #1e56c0; }
.wordmark .rest { font-weight: 600; line-height: 1; color: #15213a; }
</style>
</head>
<body>

<div class="card" id="card"><img id="score" src="assets/score.png" alt="" /></div>

<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo(["#c1","#c2","#c3"], {opacity:0, y:40}, {opacity:1, y:0, duration:0.5, ease:"back.out(1.6)", stagger:0.12}, 0.05);
